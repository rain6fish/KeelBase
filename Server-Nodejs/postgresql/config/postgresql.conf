 # =============================================================
 # AppBase PostgreSQL 生产环境调优配置
 # 适用环境: 2核4G 初期服务器（参考文档规范）
 # 警告: 请根据实际服务器规格调整数值
 # =============================================================
 
# -------
# 连接管理
# -------
max_connections = 50                    # 初期并发不高，压力交给 Node.js 连接池
# listen_addresses = 'localhost'        # 生产环境建议绑定到特定 IP

# -------
# 内存配置
# -------
shared_buffers = 512MB                  # 总内存的 25%，初期 4GB 内存够用
work_mem = 4MB                          # 单个查询排序/哈希内存，初期数据量小
maintenance_work_mem = 64MB             # 维护操作内存（VACUUM、索引重建）
effective_cache_size = 1GB              # 告诉优化器系统可用于缓存的内存量

# -------
# 写入配置
# -------
wal_buffers = 16MB                      # WAL 缓冲区
wal_level = replica                     # 流复制所需级别（生产环境保持 replica）
max_wal_size = 1GB                      # WAL 最大大小
min_wal_size = 256MB                    # WAL 最小大小

# -------
# 查询优化
# -------
random_page_cost = 1.1                  # SSD 磁盘设为 1.1，机械硬盘用 4.0
effective_io_concurrency = 200          # SSD 可设 200，机械硬盘设 2

# ----
# 自动清理 (必须开启，防止表膨胀)
# ----
autovacuum = on                         # 确保为 on
autovacuum_max_workers = 3              # 初期 3 个 worker 足够
autovacuum_naptime = 1min               # 检查间隔
autovacuum_vacuum_scale_factor = 0.01   # 更快触发 VACUUM（默认 0.2）
autovacuum_analyze_scale_factor = 0.01  # 更快更新统计信息

# -------
# 日志
# -------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'ddl'                   # 仅记录 DDL，生产环境可按需开启 'mod' 或 'all'
log_min_duration_statement = 1000       # 慢查询阈值（1秒）
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a'
