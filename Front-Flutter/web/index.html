<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ShiYu-AppBase - App Full-Stack Base Platform">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ShiYu-AppBase">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Google Sign-In (Web): uncomment and replace with your Web client ID
       from Google Cloud Console → APIs & Services → Credentials.
       Required for the "Sign in with Google" button to work on Web.
  <meta name="google-signin-client_id" content="YOUR_WEB_CLIENT_ID.apps.googleusercontent.com">
  -->

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ShiYu-AppBase</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Loading placeholder — removed by Flutter engine after initialization.
    Must exist for the engine's DOM cleanup to work without errors.
  -->
  <div id="flutter-loader" style="display:flex;justify-content:center;align-items:center;height:100vh;">
    <div style="font-family:sans-serif;font-size:18px;color:#888;">Loading...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
