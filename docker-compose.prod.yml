version: '3.8'

# 生产环境覆盖配置
# 要求:
#   1. 生成 TLS 证书到 ./certs/server.crt 和 ./certs/server.key
#   2. 创建 ./webroot 目录（certbot webroot 续期的挑战应答目录）
#   3. 运行: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 注意: server 的 CORS_ORIGINS 需显式传真实前端源，如 CORS_ORIGINS=https://yourdomain.com

services:
  server:
    environment:
      - NODE_ENV=production
      - CORS_ORIGINS=${CORS_ORIGINS:-https://front.app}
    restart: always

  web:
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/ssl/certs/server.crt:ro
      - ./certs/server.key:/etc/ssl/certs/server.key:ro
      - ./webroot:/var/www/certbot:ro
    restart: always
