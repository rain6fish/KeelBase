 version: '3.8'

 # =============================================================
 # 本地开发 PostgreSQL 独立启动
 # 用途: 不启动完整项目栈，仅运行数据库用于开发调试
 # 用法: docker-compose -f postgresql/docker-compose.db.yml up -d
 # =============================================================

 services:
   postgres:
     image: postgres:17-alpine
     container_name: front-pg-dev
     environment:
       POSTGRES_DB: front
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: postgres
     ports:
       - "5432:5432"
     volumes:
       - pgdata:/var/lib/postgresql/data
       - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
       - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
     command:
       - "postgres"
       - "-c"
       - "config_file=/etc/postgresql/postgresql.conf"
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U postgres"]
       interval: 5s
       timeout: 5s
       retries: 5

 volumes:
   pgdata:
