 # ====================
 # 生产环境 HTTPS 配置
 # 使用方法：
 #   1. 将证书放到 ./certs/server.crt 和 ./certs/server.key
 #   2. 创建 ./webroot 目录（certbot webroot 自动续期的挑战应答目录）
 #   3. docker compose -f docker-compose.yml -f docker-compose.prod.yml up
 # ====================

 # ===== 压缩（E-3 性能：前端产物 gzip；nginx:alpine 默认编译 gzip 模块）=====
 # 本文件在 prod overlay 里**替换** /etc/nginx/conf.d/default.conf，所以镜像内 nginx.conf 的那份
 # gzip 配置在 prod 不生效——两处都要有，缺了 prod 就退化成明文传输（main.dart.js 3.6MB 原样发）。
 gzip on;
 # 不写 gzip_vary：Alpine 的 nginx.conf 已在 http 层设了它，重复写会 `[emerg] duplicate`（2026-09-26 实测）。
 gzip_min_length 1024;
 gzip_comp_level 6;
 # application/wasm：CanvasKit 引擎本体（5.4MB → gzip 后 2.1MB，字体子集化之后的最大单项）
 gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml image/x-icon application/wasm;

 # ===== brotli（比 gzip 再小约 12%）=====
 # 实测（2026-09-26）：canvaskit.wasm 2033→1779KB、main.dart.js 1006→891KB；br6 压 5.3MB 只要约 260ms，
 # 故用实时压缩即可（br11 更小 26% 但要 13 秒 CPU，只能构建期预压，不值当）。
 # 模块来自 Alpine 的 nginx-mod-http-brotli —— 这是 web 基座从官方 `nginx:alpine` 换成 Alpine 包的**唯一原因**
 # （官方镜像由 nginx.org 自编，与 Alpine 的模块版本不匹配、装不上）。见 Dockerfile web 阶段。
 # gzip 保留作兜底：不接受 br 的客户端自动回落。
 brotli on;
 brotli_comp_level 6;
 brotli_min_length 1024;
 brotli_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml image/x-icon application/wasm;

 server {
     listen 80;
     server_name _; # 通配：任何域名（配合自备证书 certs/server.crt）
     # ACME 挑战：certbot webroot 续期（容器挂载 ./webroot:/var/www/certbot，避免 standalone 占用 80 停机）
     location /.well-known/acme-challenge/ {
         root /var/www/certbot;
     }
     # 强制 HTTPS
     location / {
         return 301 https://$host$request_uri;
     }
 }

 server {
     listen 443 ssl;
     # 1.25.1+ 的写法；旧写法 `listen 443 ssl http2` 在 1.30 起会报 deprecated 告警
     http2 on;
     server_name _; # 通配：任何域名

     ssl_certificate     /etc/ssl/certs/server.crt;
     ssl_certificate_key /etc/ssl/certs/server.key;
     ssl_protocols       TLSv1.2 TLSv1.3;
     ssl_ciphers         HIGH:!aNULL:!MD5:!DES:!3DES:!RC4;
     ssl_prefer_server_ciphers on;
     # 不写 ssl_session_cache：Alpine 的 nginx.conf 已按 `shared:SSL:2m` 声明了同名 zone，
     # 这里再按 10m 声明会 `[emerg] size conflicts`（zone 名全局唯一、与层级无关，2026-09-26 实测）。
     ssl_session_timeout 10m;

     # HSTS（先注释，确认 HTTPS 稳定后再启用）
     # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

     add_header X-Content-Type-Options    "nosniff" always;
     add_header X-Frame-Options           "DENY" always;
     add_header X-XSS-Protection          "0" always;
     add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
     add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
     # CR-23 CSP（宽松版以兼容 Flutter Web CanvasKit wasm + 内联样式；若 Flutter/管理台异常可注释此行使头降级）
     add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

     root /usr/share/nginx/html;
     index index.html;

     location /api/ {
         proxy_pass http://server:3000;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         client_max_body_size 11m;
         # SSE：AI 流式对话/通知需实时下发；默认 proxy_buffering 缓冲整段会令确认卡无法实时（demo 2026-09-05 暴露）
         proxy_buffering off;
         proxy_cache off;
         proxy_read_timeout 300s;
     }

     location /uploads/ {
         proxy_pass http://server:3000;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         expires 30d;
         add_header Cache-Control "public, immutable";
     }

     # 管理台（Web-Admin-Vue Vue3 独立构建 /admin 子路径，admin-only 控制台）
     location /admin/ {
         try_files $uri $uri/ /admin/index.html;
         add_header Cache-Control "no-cache, must-revalidate";
     }
     location = /admin/index.html { add_header Cache-Control "no-store"; }

     # 普通用户 Web 工作台（/user 子路径独立构建，仅工作台页面）
     location /user/ {
         try_files $uri $uri/ /user/index.html;
         add_header Cache-Control "no-cache, must-revalidate";
     }
     location = /user/index.html { add_header Cache-Control "no-store"; }

     # 移动主 App 预览（Flutter web，hash 路由无需 SPA fallback）
     location /mobile/ {
         try_files $uri $uri/ /mobile/index.html;
         add_header Cache-Control "no-cache, must-revalidate";
     }
     location = /mobile/index.html { add_header Cache-Control "no-store"; }

     # 官方演示视频（国内镜像：/demo 目录由 ECS prod overlay 挂载宿主 demo/）
     location /demo/ {
         add_header Cache-Control "public, max-age=3600";
         try_files $uri =404;
     }

     # 根路径 → 普通用户 Web 工作台（Vue hash 路由：/user/#/workbench）
     location = / {
         return 302 /user/;
     }

     location / {
         # 兜底：静态资源（/mobile 等子路径已由上方 location 命中）直接走 try_files
         try_files $uri $uri/ /admin/index.html;
         add_header Cache-Control "no-cache, must-revalidate";
     }
 }
