 # ====================
 # 生产环境 HTTPS 配置
 # 使用方法：
 #   1. 将证书放到 ./certs/server.crt 和 ./certs/server.key
 #   2. docker compose -f docker-compose.yml -f docker-compose.prod.yml up
 # ====================

 server {
     listen 80;
     server_name _; # 通配：任何域名（配合自备证书 certs/server.crt）
     # 强制 HTTPS
     return 301 https://$host$request_uri;
 }

 server {
     listen 443 ssl http2;
     server_name _; # 通配：任何域名

     ssl_certificate     /etc/ssl/certs/server.crt;
     ssl_certificate_key /etc/ssl/certs/server.key;
     ssl_protocols       TLSv1.2 TLSv1.3;
     ssl_ciphers         HIGH:!aNULL:!MD5:!DES:!3DES:!RC4;
     ssl_prefer_server_ciphers on;
     ssl_session_cache   shared:SSL:10m;
     ssl_session_timeout 10m;

     # HSTS（先注释，确认 HTTPS 稳定后再启用）
     # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

     add_header X-Content-Type-Options    "nosniff" always;
     add_header X-Frame-Options           "DENY" always;
     add_header X-XSS-Protection          "0" always;
     add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
     add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
     # CR-23 CSP（宽松版以兼容 Flutter Web CanvasKit wasm + 内联样式；若 Flutter/管理台异常可注释此行使头降级）
     add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

     root /usr/share/nginx/html;
     index index.html;

     location /api/ {
         proxy_pass http://server:3000;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         client_max_body_size 11m;
     }

     location /uploads/ {
         proxy_pass http://server:3000;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         expires 30d;
         add_header Cache-Control "public, immutable";
     }

     location / {
         try_files $uri $uri/ /index.html;
         add_header Cache-Control "no-cache, must-revalidate";
     }
 }
