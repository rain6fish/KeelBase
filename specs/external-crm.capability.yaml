# 外部系统能力声明（EB-3 轻量 Capability Declaration）
#
# 比 OpenAPI 更轻量的接入方式：直接声明「这个业务系统能做什么」——
# 无需写完整 API 结构，KeelBase 据此生成 B 路径 Proxy 工具（AI 可调用 + 治理分级）。
# action: read → R1（自动执行）| write → R3（需人工确认）；risk 字段可显式覆盖。
system:
  name: 外部 CRM
  baseUrl: http://legacy-crm:8080/api
  audience: legacy-crm

capabilities:
  - id: list_customers
    label: 客户列表
    description: 按关键字查询客户（风险分析的数据来源之一）
    action: read
    http: { method: GET, path: /customers, query: [keyword] }

  - id: get_customer
    label: 客户详情
    action: read
    http: { method: GET, path: /customers/{id}, pathParams: [id] }

  - id: list_customer_orders
    label: 客户订单
    description: 该客户订单列表——逾期/金额分析依据
    action: read
    http: { method: GET, path: /customers/{id}/orders, pathParams: [id] }

  - id: create_followup_task
    label: 创建跟进任务
    description: 在外部 CRM 创建跟进任务（写回外部系统，R3 需人工确认）
    action: write
    risk: R3
    http:
      method: POST
      path: /customers/{id}/followups
      pathParams: [id]
      body: [content, dueDate]

  - id: update_order_amount
    label: 修改订单金额
    description: 折扣/改价类写操作——高风险，需人工确认（企业最关心）
    action: write
    risk: R3
    http:
      method: PATCH
      path: /customers/{id}/orders/{orderId}
      pathParams: [id, orderId]
      body: [amount]
