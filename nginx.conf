 server {
     listen 80;
     server_name localhost;

     root /usr/share/nginx/html;
     index index.html;

     # ===== 安全头部（即使通过 HTTP 也发送） =====
     add_header X-Content-Type-Options    "nosniff" always;
     add_header X-Frame-Options           "DENY" always;
     add_header X-XSS-Protection          "0" always;
     add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
     add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

     location /api/ {
         proxy_pass http://server:3000;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;

         # 限制 API 请求体大小
         client_max_body_size 11m;
     }

     location /uploads/ {
         proxy_pass http://server:3000;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

         # 静态文件缓存
         expires 30d;
         add_header Cache-Control "public, immutable";
     }

     # 管理台（Web-Admin-Vue Vue3 独立构建 /admin 子路径，admin-only 控制台）
     location /admin/ {
         try_files $uri $uri/ /admin/index.html;
         add_header Cache-Control "no-cache, must-revalidate";
     }

     # 普通用户 Web 工作台（/user 子路径独立构建，仅工作台页面）
     location /user/ {
         try_files $uri $uri/ /user/index.html;
         add_header Cache-Control "no-cache, must-revalidate";
     }

     # 移动主 App 预览（Flutter web，hash 路由无需 SPA fallback）
     location /mobile/ {
         try_files $uri $uri/ /mobile/index.html;
         add_header Cache-Control "no-cache, must-revalidate";
     }

     # 根路径 → 普通用户 Web 工作台（Vue hash 路由：/user/#/workbench）
     location = / {
         return 302 /user/;
     }

     location / {
         # 兜底：静态资源（/mobile 等子路径已由上方 location 命中）直接走 try_files
         try_files $uri $uri/ /admin/index.html;
         add_header Cache-Control "no-cache, must-revalidate";
     }
 }
