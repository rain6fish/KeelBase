version: '3.8'

# Images are pinned to a digest (`tag@sha256:...`), same rule as docker-compose.yml: read a new digest
# from the registry at pin time, never copy one out of a report. Procedure: docs/manual/supply-chain.md §4.
# 镜像按摘要钉住（`tag@sha256:...`），与 docker-compose.yml 同一条规则：新摘要钉的时候从镜像仓库现读，
# 别抄报告。做法见 docs/manual/supply-chain.md §4。

# 可观测性栈 — Prometheus + Grafana + Jaeger + Loki
#
# 用法一（本地开发，server 跑在宿主机）：
#   docker compose -f docker-compose.observability.yml up -d
#   然后本地启动 server（OTEL_ENABLED=true OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 LOKI_ENABLED=true LOKI_URL=http://localhost:3100 node dist/main）
#   Prometheus 通过 host.docker.internal:3000 抓取宿主机 server；pino 直推宿主机 Loki
#
# 用法二（生产/完整编排，server 也在容器）：
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
#   此时 prometheus.yml 的 targets 需改回 server:3000，并给 server 叠加：
#     OTEL_ENABLED=true
#     OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
#     LOKI_ENABLED=true
#     LOKI_URL=http://loki:3100
#
# 访问：
#   Grafana    http://localhost:3001  (匿名)
#   Prometheus http://localhost:9090
#   Jaeger     http://localhost:16686
#   Loki       http://localhost:3100

services:
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    ports:
      - "9090:9090"
    volumes:
      # 整体挂载目录，含 prometheus.yml 与 rules/ 告警规则
      - ./infra/observability/prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    ports:
      - "3001:3000"
    environment:
      # CR-23：匿名从 Admin 降为 Viewer（只读看板，防匿名改配置）；管理员凭据可经 env 覆盖
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  jaeger:
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/observability/loki:/etc/loki
      - loki-data:/loki

volumes:
  grafana-data:
  loki-data:
