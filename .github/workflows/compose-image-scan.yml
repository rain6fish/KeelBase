# Compose server image scan — build the container `docker compose up` actually runs, and scan it.
#
# The publish gate (`docker-publish.yml`) scans only the `Dockerfile.single` image. The compose
# deployment builds a different image: `Dockerfile` target `server`, used by the `server`, `governance`
# and `sidecar` services in `docker-compose.yml`. That image ships the backend's prod and dev
# dependencies, so it is the largest surface no other gate scans. Decision D4 (2026-11-11) is to scan
# it here.
#
# Scan settings are byte-for-byte the publish gate's: same pinned action commit, same pinned Trivy
# version, `severity HIGH,CRITICAL`, `ignore-unfixed true`, `exit-code '1'`, `.trivyignore.yaml`.
# Exceptions therefore live in one place and mean the same thing in both gates.
#
# 构建 `docker compose up` 真正运行的那个容器并扫描它。
#
# 发布门禁（`docker-publish.yml`）只扫 `Dockerfile.single` 的镜像。compose 部署构建的是另一个镜像：
# `Dockerfile` 的 `server` 阶段，由 `docker-compose.yml` 的 `server` / `governance` / `sidecar` 三个服务使用。
# 那个镜像把后端的生产与开发依赖都打进去，是当前没有任何其它门禁扫描的最大一面。D4（2026-11-11）决定在这里扫它。
#
# 扫描设置与发布门禁逐字相同：同一个钉住的 action 提交、同一个钉住的 Trivy 版本、`HIGH,CRITICAL`、
# `ignore-unfixed true`、`exit-code '1'`、`.trivyignore.yaml`。因此例外只有一处、两道门禁里含义相同。
#
# Measured 2026-11-11 on a real local build with these exact settings, twice. The first build — the
# `server` stage as it stood when this gate was wired — exited **1 with 10 HIGH, 0 CRITICAL**: all ten
# were the pinned `node:22-alpine` base's own npm under `/usr/local/lib/node_modules/npm`, while the
# application tree (prod + dev dependencies) and the Alpine OS layer read clean. After that reading,
# `create-admin` / `seed-demo` were compiled to `build-scripts/*.js` at build time so the deployment
# scripts call them with plain `node`, and the `server` stage took the same npm/npx removal
# `Dockerfile.single` already ships (CR-23). Re-measured with the same settings: **0 findings, exit 0**.
# The first reading stays on the record because catching exactly that is what this gate is for.
#
# 2026-11-11 以这组完全相同的设置对真实本地构建实测了两次。第一次是本门禁接线时 `server` 阶段的现状：
# **以 1 退出、10 条 HIGH（0 CRITICAL）** —— 十条全在钉住的 `node:22-alpine` 基础镜像自带的 npm
# （`/usr/local/lib/node_modules/npm`）里，而应用树（生产 + 开发依赖）与 Alpine 操作系统层都是 0 条。
# 那次读数之后，`create-admin` / `seed-demo` 改为在构建期编译成 `build-scripts/*.js`，部署脚本用普通
# `node` 调用；`server` 阶段随之采用与 `Dockerfile.single` 相同的删 npm/npx 做法（CR-23）。同样设置复测：
# **0 条发现、以 0 退出**。第一次的读数保留在案 —— 本门禁存在的意义正是抓到它。

name: Compose Image Scan

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Server-NestJS/**
      - .trivyignore.yaml
      - .github/workflows/compose-image-scan.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - Server-NestJS/**
      - .trivyignore.yaml
      - .github/workflows/compose-image-scan.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compose-image-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: keelbase:server-scan
  # Pinned exactly as in docker-publish.yml so the two gates cannot drift apart silently.
  # 与 docker-publish.yml 完全一致地钉住，两道门禁不会悄悄分叉。
  TRIVY_VERSION: v0.76.2
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

jobs:
  scan-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The server build copies `Server-NestJS/` into the image; the protocol submodule is part of
          # that tree, so check it out as `ci.yml` does.
          # server 构建会把 `Server-NestJS/` 拷进镜像，协议 submodule 属于这棵树，故与 `ci.yml` 一样检出。
          submodules: true

      # The `server` target does not depend on Flutter or admin-console artefacts — it copies `dist/`
      # and `node_modules/` from the `server-build` stage — so no Flutter install is needed here.
      # `server` 阶段不依赖 Flutter 或管理台产物（它只从 `server-build` 阶段拷 `dist/` 与 `node_modules/`），
      # 因此这里不需要装 Flutter。
      - name: Build compose server image
        run: docker build -f Dockerfile --target server -t "$IMAGE_NAME" .

      # Report first, gate second — same order and same reason as the publish gate: this step installs
      # Trivy and downloads the DB, so the version/timestamp record below runs on a warm cache and
      # happens before any red can stop the job. `--ignore-unfixed` in the gate would hide unfixed
      # findings; this step prints them.
      # 先报告、后判红 —— 与发布门禁同序同理：这一步装好 Trivy 并下载数据库，下面的版本/时间戳记录
      # 因此是热缓存、且发生在任何红之前。判红那一步的 `--ignore-unfixed` 会藏起无修复的发现，这一步打印出来。
      - name: Scan image — report HIGH/CRITICAL (does not fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          version: ${{ env.TRIVY_VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: trivy-high-critical.json
          cache: true
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}

      - name: Report findings with no fixed version
        run: node scripts/trivy-unfixed-report.mjs trivy-high-critical.json

      - name: Record Trivy version and vulnerability DB timestamp
        shell: bash
        run: |
          set -euo pipefail
          trivy --version
          META="$TRIVY_CACHE_DIR/db/metadata.json"
          if [ ! -f "$META" ]; then
            echo "::error::Trivy DB metadata not found at $META — the scan below cannot be attributed to a database"
            exit 1
          fi
          echo "Trivy DB metadata: $(cat "$META")"

      # Fail on HIGH/CRITICAL **with a fix available**, exactly like the publish gate. Exceptions live
      # in `.trivyignore.yaml`; `npm run check:trivyignore` requires a statement and an expiry on every
      # entry, and the same file already governs the published image.
      #
      # Only **有修复版本**的 HIGH/CRITICAL 判红，与发布门禁完全一致。例外写在 `.trivyignore.yaml`；
      # `npm run check:trivyignore` 要求每条都带理由与到期日，这份文件同样管辖已发布的镜像。
      - name: Scan image — fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}
          version: ${{ env.TRIVY_VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore.yaml
          cache: true
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
