# KeelBase CI（GitHub Actions，仓库镜像到 GitHub 后触发）
# 测试密钥在运行时用 openssl rand 随机生成，不入库、不落盘，避免公开仓库泄露。

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server-NestJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server-NestJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: npm ci
      - name: 生成随机测试密钥
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run test:cov
        env:
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          ENCRYPTION_HMAC_KEY: ${{ env.ENCRYPTION_HMAC_KEY }}
      - run: npm run test:e2e
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          ENCRYPTION_HMAC_KEY: ${{ env.ENCRYPTION_HMAC_KEY }}
          DB_TYPE: sqlite
          DB_PATH: ./data/test.sqlite

  migration-consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server-NestJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: npm ci
      # 用已提交迁移建库，再生成对比：实体与迁移一致 → "No changes" 退出码非零但无文件 → 通过
      - name: 校验迁移与实体一致
        run: |
          rm -f ./data/consistency.sqlite
          export DB_PATH=./data/consistency.sqlite
          export ENCRYPTION_KEY=$(openssl rand -hex 32)
          export ENCRYPTION_HMAC_KEY=$(openssl rand -hex 32)
          npm run migration:run
          OUTPUT=$(npm run migration:generate -- src/migrations/_ConsistencyCheck 2>&1)
          echo "$OUTPUT"
          if ls src/migrations/*_ConsistencyCheck* 2>/dev/null; then
            echo "::error::实体新增了未迁移的变更，请运行 migration:generate 提交迁移"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server-NestJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: npm ci
      - run: npm run build

  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web-Admin-Vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Web-Admin-Vue/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 严格 lint（不带 --fix，避免 CI 悄悄改文件）；本地开发用 npm run lint 自动修复
      - run: npx eslint . --ext .vue,.ts
      # vitest + coverage 门槛（statements/branches/functions/lines ≥ 30/50/25/30，见 vitest.config.ts）
      - run: npx vitest run --coverage
      - run: npm run build

  taro-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-Taro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Front-Taro/package-lock.json
      - run: npm ci
      - run: npm run build:h5

  flutter-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-Flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true
      - run: flutter pub get
      # 容忍既有 warning/info（项目有 100+ 历史 lint 问题），仅 error 视为失败
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      # 单测 + 覆盖率门禁（行覆盖 ≥45%，防回归；awk 解析 lcov.info 不引入额外依赖）
      - run: flutter test --coverage
      - name: Enforce line coverage ≥45%
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {
            if (lf == 0) { print "no coverage data"; exit 1 }
            pct = 100 * lh / lf;
            printf "Line coverage: %.1f%%\n", pct;
            if (pct < 45) { print "Coverage below 45% threshold"; exit 1 }
          }' coverage/lcov.info
