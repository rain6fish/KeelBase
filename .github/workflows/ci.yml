# KeelBase CI（GitHub Actions，仓库镜像到 GitHub 后触发）
# 测试密钥在运行时用 openssl rand 随机生成，不入库、不落盘，避免公开仓库泄露。

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server-NestJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server-NestJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: npm ci
      - name: 生成随机测试密钥
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run test:cov
        env:
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          ENCRYPTION_HMAC_KEY: ${{ env.ENCRYPTION_HMAC_KEY }}
      - run: npm run test:e2e
        env:
          NODE_ENV: test
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          ENCRYPTION_HMAC_KEY: ${{ env.ENCRYPTION_HMAC_KEY }}
          DB_TYPE: sqlite
          DB_PATH: ./data/test.sqlite

  migration-consistency:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server-NestJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: npm ci
      # 用已提交迁移建库，再生成对比：实体与迁移一致 → "No changes" 退出码非零但无文件 → 通过
      - name: 校验迁移与实体一致
        run: |
          rm -f ./data/consistency.sqlite
          export DB_PATH=./data/consistency.sqlite
          export ENCRYPTION_KEY=$(openssl rand -hex 32)
          export ENCRYPTION_HMAC_KEY=$(openssl rand -hex 32)
          npm run migration:run
          # typeorm migration:generate 对「无变化」返回退出码 1；bash -e 下命令替换失败会直接中止，
          # 需 || true 让其非致命，再由下方 if ls 判断是否真产生漂移文件。
          OUTPUT=$(npm run migration:generate -- src/migrations/_ConsistencyCheck 2>&1 || true)
          echo "$OUTPUT"
          if ls src/migrations/*_ConsistencyCheck* 2>/dev/null; then
            echo "::error::实体新增了未迁移的变更，请运行 migration:generate 提交迁移"
            exit 1
          fi

  # postgres 迁移一致性（roadmap 未做项）：真实 pgvector/pg17 上全量白名单迁移跑通 +
  # 实体↔迁移无漂移。防 postgres 方言回归——如 sqlite-only 迁移误入 postgres 白名单
  # 导致 AUTOINCREMENT 语法失败（曾由 80528d0 修复，需 CI 持续拦截）。
  migration-consistency-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server-NestJS
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keelbase_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: npm ci
      - name: postgres 全量迁移跑通 + 一致性
        env:
          DB_TYPE: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: keelbase_ci
        run: |
          export ENCRYPTION_KEY=$(openssl rand -hex 32)
          export ENCRYPTION_HMAC_KEY=$(openssl rand -hex 32)
          npm run migration:run
          # migration:generate 对「无变化」返回退出码 1；同 sqlite job 用 || true + 文件判断
          OUTPUT=$(npm run migration:generate -- src/migrations/_PgConsistencyCheck 2>&1 || true)
          echo "$OUTPUT"
          if ls src/migrations/*_PgConsistencyCheck* 2>/dev/null; then
            echo "::error::postgres 实体新增了未迁移的变更，请运行 migration:generate 提交迁移"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server-NestJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: npm ci
      - run: npm run build

  # 架构边界门禁（docs/architecture-boundary.md）：Core 无 UI 框架依赖、无前端代码引用
  core-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-core-boundary.mjs

  # 生成器/导入 CLI 测试（零依赖 node:test，root 跑）——keelbase init 与 OpenAPI/Schema 导入防回归
  cli-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --test scripts/keelbase-init.test.mjs
      # Provenance：仓库自带 manifest，inspect 应识别为 KeelBase 应用并退出 0
      - run: node scripts/keelbase-init.mjs inspect
      # Provenance：doctor 四查（完整性/一致性/运行时/版本）应 PASS 退出 0
      - run: node scripts/keelbase-init.mjs doctor

  # 合成陌生人冒烟（W3 harness 进 CI）：keelbase init 生成模块 → 编译 → 测试（防生成器闭环回归）
  stranger-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: cd Server-NestJS && npm ci
      - name: keelbase init 生成 → 编译 → 测试（模拟陌生人 30min Build）
        run: |
          node scripts/keelbase-init.mjs --module cismoke --label CI冒烟 --fields title:string,content:text
          cd Server-NestJS && npm run build && npm test -- cismoke

  # 供应链安全（评审三 §6）：依赖完整性 + 漏洞审计 + SBOM
  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server-NestJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      # npm ci 即依赖完整性检查：lockfile 与 package.json 不一致会直接失败
      - run: npm ci
      # 生产依赖漏洞审计：high/critical 即失败（2026-08-20 已清零 4 个 high，含 @nestjs/swagger→js-yaml/fast-uri）
      - name: 依赖漏洞审计
        run: npm audit --omit=dev --audit-level=high
      # SBOM（SPDX）生成并上传，供供应链核查（npm sbom 输出到 stdout，重定向落盘；--output 不写文件）
      - name: 生成 SBOM
        run: npm sbom --sbom-format spdx --omit=dev > sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: keelbase-sbom
          path: Server-NestJS/sbom.spdx.json
          if-no-files-found: error

  # 1.0 Release Gate（确定性模式，§7.3 Gate 3）：Gate1 Golden + Build + Trust + Private 一次证明
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: cd Server-NestJS && npm ci
      - name: 生成随机测试密钥
        run: |
          echo "ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      # 确定性五维 + Gate1（LLM 部分由 LLM_ENV=1 标注，云端跑见 docs/benchmark/）
      - name: 运行 Release Gate（确定性）
        run: ./scripts/release-gate.sh
        env:
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          ENCRYPTION_HMAC_KEY: ${{ env.ENCRYPTION_HMAC_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ env.JWT_REFRESH_SECRET }}
          NODE_ENV: test

  # Run/Adversarial 云端实证（§7.4 #2）：真实 LLM 对话（Run/Safety）+ 攻击集回归。
  # 非阻塞标注——continue-on-error 让失败以警告呈现不 gate 流水线；缺 DEEPSEEK_API_KEY 时跳过。
  # 注意：GitHub Actions 禁止在 if 条件里直接引用 secrets（会导致 workflow 解析失败），
  # 因此 secret 经 job 级 env 透传，步骤 if 用 env.DEEPSEEK_API_KEY 判断。
  run-adversarial:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Server-NestJS/package-lock.json
      - run: cd Server-NestJS && npm ci
      - name: Run/Adversarial 云端实证（自起隔离后端 + DeepSeek）
        if: env.DEEPSEEK_API_KEY != ''
        run: ./scripts/benchmark/run-adversarial.sh
      - name: 缺 key 跳过标注
        if: env.DEEPSEEK_API_KEY == ''
        run: echo "DEEPSEEK_API_KEY 未配置——Run/Adversarial 跳过（配置 secrets 后自动启用）"
      - uses: actions/upload-artifact@v4
        if: env.DEEPSEEK_API_KEY != ''
        with:
          name: adversarial-reports
          path: docs/benchmark/*.md
          if-no-files-found: ignore

  web-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web-Admin-Vue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Web-Admin-Vue/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 严格 lint（不带 --fix，避免 CI 悄悄改文件）；本地开发用 npm run lint 自动修复
      - run: npx eslint . --ext .vue,.ts
      # vitest + coverage 门槛（statements/branches/functions/lines ≥ 30/50/25/30，见 vitest.config.ts）
      - run: npx vitest run --coverage
      - run: npm run build

  # React 管理台预览版（CLAUDE §13.1）：转正决策前补 CI——typecheck/lint/test/build 全绿，不 gate 主发布
  web-admin-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web-Admin-React
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Web-Admin-React/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # 严格 lint（不带 --fix，避免 CI 悄悄改文件；本地 npm run lint 自动修复）
      - run: npx eslint .
      - run: npm test
      - run: npm run build

  taro-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-Taro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Front-Taro/package-lock.json
      - run: npm ci
      - run: npm run build:h5

  flutter-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Front-Flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          cache: true
      - run: flutter pub get
      # 容忍既有 warning/info（项目有 100+ 历史 lint 问题），仅 error 视为失败
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      # 单测 + 覆盖率门禁（行覆盖 ≥45%，防回归；awk 解析 lcov.info 不引入额外依赖）
      - run: flutter test --coverage
      - name: Enforce line coverage ≥45%
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {
            if (lf == 0) { print "no coverage data"; exit 1 }
            pct = 100 * lh / lf;
            printf "Line coverage: %.1f%%\n", pct;
            if (pct < 45) { print "Coverage below 45% threshold"; exit 1 }
          }' coverage/lcov.info
