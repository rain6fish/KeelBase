# 发布 Docker 单容器镜像到 ghcr.io（GitHub Container Registry）
#
# 触发：
#   - 推送 tag v*（如 v0.9.0）→ 发布 latest + vX.Y.Z
#   - 手动 workflow_dispatch → 发布 latest + run 号
#
# 产物：ghcr.io/rain6fish/keelbase:latest / :vX.Y.Z
# 使用（公开镜像免登录）：镜像不内置密钥，三条密钥必须由运行方提供（缺失即启动失败）
# Usage: the image ships no secrets; supply all three at run time (it refuses to start without them).
#   docker run -p 3000:3000 \
#     -e JWT_SECRET=$(openssl rand -hex 32) -e JWT_REFRESH_SECRET=$(openssl rand -hex 32) \
#     -e ENCRYPTION_KEY=$(openssl rand -hex 32) \
#     ghcr.io/rain6fish/keelbase:latest
#
# 构建策略：flutter-action 在 runner 宿主机构建 Flutter web（build/web），
# Dockerfile.single 的 flutter-build stage 是 scratch COPY 该产物 —— 与本机一致、Linux 稳定。
#
# 发布顺序：build（不推送）→ Trivy 扫描 → push。扫描判红时，推送这一步根本不会执行。
# Publish order: build (no push) → Trivy scan → push. A red scan means the push step never runs.

name: Docker Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  IMAGE_NAME: ghcr.io/rain6fish/keelbase
  # Trivy scans the built image before anything is pushed. The action is pinned by commit (in `uses:`,
  # which cannot take an expression) and the Trivy binary by version, so the verdict cannot change under
  # a floating tag. The DB timestamp is recorded in the log below the same way.
  # Trivy 在推送之前扫描构建出的镜像。action 按提交钉住（`uses:` 不接受表达式）、Trivy 二进制按版本钉住，
  # 结论不会随浮动标签而变。数据库时间戳同样在下面写进日志。
  TRIVY_VERSION: v0.76.2
  TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 ghcr.io 需要 packages:write
    steps:
      - uses: actions/checkout@v5

      # 宿主机构建 Flutter web 产物（对齐 scripts/docker-single.sh 的 build_flutter_web）
      # 版本固定为解析 Front-Flutter/pubspec.lock 的那一版，否则 pub 会按 runner 的 SDK 重新解析，
      # 可能出现「锁文件里的 objective_c 与 code_assets 不配套」这类只能在构建时才炸的组合。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true
      - name: Build Flutter web
        working-directory: Front-Flutter
        shell: bash
        run: |
          flutter doctor -v 2>&1 | tail -20 || true
          flutter pub get
          set +e
          flutter build web --release --base-href=/mobile/ --no-web-resources-cdn --dart-define=API_BASE_URL=/api/v1 > /tmp/flutter_build.log 2>&1
          RC=$?
          echo "flutter build exit: $RC"
          if [ $RC -ne 0 ]; then
            echo "--- flutter build error ---"
            tail -60 /tmp/flutter_build.log
            echo "::error::flutter build failed (exit $RC)"
            exit $RC
          fi
          # 判据用 main.dart.js（编译产物）而非 build/web/index.html：构建失败也会留下残缺的 index.html，
          # 那会让镜像 COPY 到一起不了的产物
          if [ ! -f build/web/main.dart.js ]; then
            echo "--- flutter build produced no compiled app ---"
            tail -60 /tmp/flutter_build.log
            echo "::error::flutter build produced no build/web/main.dart.js"
            exit 1
          fi

      # 构建 Web-Admin-Vue（Vue3）产物由 Dockerfile admin-build stage 在容器内完成，无需宿主机

      # 移动预览门禁：产物会被 COPY 到 public/mobile，基路径/自托管资源/CSP 三者任一不合就白屏
      - name: Assert mobile preview is servable
        run: npm run check:mobile-preview

      # 登录 ghcr.io（用内置 GITHUB_TOKEN）
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          IMG="$IMAGE_NAME"
          TAGS="$IMG:latest"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            TAGS="$TAGS,$IMG:$VER"
          else
            TAGS="$TAGS,$IMG:run-${{ github.run_number }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      # Build only — nothing is pushed yet. `load: true` puts the image in the local Docker daemon so
      # Trivy can scan it by tag; the publish tags are applied here too, so the push step below needs no
      # re-tagging. A failing scan stops the job and the push step never runs.
      # 只构建 —— 此时还没有任何推送。`load: true` 把镜像装进本地 Docker，Trivy 可按标签扫描；发布标签也一并
      # 打上，下面的推送步骤就不必再重打标签。扫描判红则 job 停下，推送步骤根本不会执行。
      - name: Build single-container image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.single
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:scan
            ${{ steps.meta.outputs.tags }}

      # Report first, gate second: the report step installs Trivy and downloads the DB, so the gate step
      # runs with a warm cache and the version/timestamp recording below happens before any red can stop
      # the job. `--ignore-unfixed` in the gate would hide unfixed findings; this step prints them.
      # 先报告、后判红：报告这一步装好 Trivy 并下载数据库，判红那一步因此是热缓存，而且下面的版本/时间戳记录
      # 发生在任何红之前。判红那一步的 `--ignore-unfixed` 会把无修复的发现藏起来 —— 这一步把它们打印出来。
      - name: Scan image — report HIGH/CRITICAL (does not fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:scan
          version: ${{ env.TRIVY_VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: trivy-high-critical.json
          cache: true
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}

      - name: Report findings with no fixed version
        run: node scripts/trivy-unfixed-report.mjs trivy-high-critical.json

      - name: Record Trivy version and vulnerability DB timestamp
        shell: bash
        run: |
          set -euo pipefail
          trivy --version
          META="$TRIVY_CACHE_DIR/db/metadata.json"
          if [ ! -f "$META" ]; then
            echo "::error::Trivy DB metadata not found at $META — the scan below cannot be attributed to a database"
            exit 1
          fi
          echo "Trivy DB metadata: $(cat "$META")"

      # Fail on HIGH/CRITICAL **with a fix available**. Unfixed findings were reported by the step above
      # and do not block a publish — otherwise an image could never ship while upstream owes a fix.
      # Exceptions live in `.trivyignore.yaml`; `npm run check:trivyignore` requires a statement and an
      # expiry on every entry.
      #
      # Measured 2026-11-10 with these exact settings: the pinned `node:22-alpine` base currently fails
      # with 10 fixable HIGH in npm's bundled node_modules (OS packages clean); `alpine:3.24` is clean and
      # `node:14-alpine` exits 1. Those readings are of the **base**; the image this workflow ships is
      # scanned after `Dockerfile.single`'s `single` stage drops the base's bundled npm, and it exits 0
      # with 0 findings (2026-11-10, same settings). See docs/manual/supply-chain.md §1/§7 — if a future
      # base brings findings of its own, bumping the digest or accepting a triaged exception is a
      # decision, not something this workflow does silently.
      #
      # 只对**有修复版本**的 HIGH/CRITICAL 判红。无修复的发现由上面那一步报告，不阻止发布 —— 否则在上游
      # 补丁到来之前镜像永远发不出去。例外写在 `.trivyignore.yaml`；`npm run check:trivyignore` 要求每条都带
      # 理由与到期日。
      #
      # 2026-11-10 以完全相同的一组设置实测：钉住的 `node:22-alpine` 基础当前判红，npm 自带 node_modules 里
      # 有 10 条有修复的 HIGH（操作系统包干净）；`alpine:3.24` 干净，`node:14-alpine` 以 1 退出。
      # 这几个读数是**基础镜像**的；本工作流发布的镜像在 `Dockerfile.single` 的 `single` 阶段删掉基础自带的
      # npm 之后才被扫描，2026-11-10 以同一组设置实测以 0 退出、0 条发现。
      # 见 docs/manual/supply-chain.md §1/§7 —— 将来若有新基础自带发现，升级摘要还是登记一条有期限的例外，
      # 仍是需要人裁决的事，不是这个工作流会悄悄做的事。
      - name: Scan image — fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:scan
          version: ${{ env.TRIVY_VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore.yaml
          cache: true
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}

      - name: Push scanned image
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            echo "pushing $tag"
            docker push "$tag"
          done

  # The SBOM is an inventory, not a verdict: the image gate above decides whether anything ships. This job
  # attaches the same BOM the CI gate validates to the GitHub Release for the tag, so a reviewer or a
  # customer can take evidence without rebuilding the tree. It regenerates the file with the same script
  # (`scripts/generate-sbom.sh`) rather than copying flags, so a release asset cannot drift from the
  # artifact CI checked. Signing it (Sigstore attestation) is deliberately out of scope — that is a
  # separate identity/key decision.
  #
  # If the tag is pushed before a maintainer writes the release notes, this creates a DRAFT release with
  # the asset; nothing is public until a human fills in the notes and publishes it. Re-running uploads to
  # the existing release with --clobber.
  #
  # SBOM 是清单、不是判定：能不能发由上面的镜像门禁决定。本 job 把 CI 门禁核过的那份 BOM 附到该 tag 的
  # GitHub Release 上，评审或客户不用重建这棵树就能取证。它用同一个脚本（`scripts/generate-sbom.sh`）
  # 重新生成，而不是复制扫描参数，于是发版资产不可能与 CI 核过的那份漂开。签名（Sigstore attestation）
  # 有意不在射程内 —— 那是另一个关于身份与密钥的决定。
  #
  # 若 tag 先于维护者写发布说明被推送，本 job 会建一份**草稿**Release 并附上资产；在人填好说明并发布之前
  # 不公开。重跑时以 `--clobber` 改传到已有的 Release 上。
  sbom-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建/更新 Release 并上传资产 / create or update the release and upload assets
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true   # 契约子模块带一份锁文件，SBOM 覆盖检查要求它 / one lockfile lives there
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Generate the SBOM (same script CI validates)
        run: bash scripts/generate-sbom.sh sbom.cdx.json sbom-scan.log
      - name: Attach the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sbom.cdx.json --clobber
          else
            NOTES=$'Draft created by the release workflow; add the release notes before publishing.\n\n由发布工作流创建的草稿；发布前请补上发布说明。'
            gh release create "$TAG" sbom.cdx.json --title "$TAG" --draft --notes "$NOTES"
          fi
