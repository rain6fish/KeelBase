# Dependabot：KeelBase 采用「Security-first」依赖策略
# - 保留 Security Updates：发现可修复漏洞时仍可创建安全 PR。
# - 普通 Version Updates 不持续制造 PR：open-pull-requests-limit: 0。
# - 普通依赖升级改为按项目阶段人工、批量处理，避免依赖漂移影响 Golden Demo / E2E / Agent Benchmark。
# - Dependabot alerts 由 GitHub Security 设置独立管理。

version: 2
updates:
  # 后端 NestJS（npm）
  - package-ecosystem: npm
    directory: /Server-NestJS
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0

  # Web 管理台 / 工作台（Vue3，npm）
  - package-ecosystem: npm
    directory: /Web-Admin-Vue
    schedule:
      interval: weekly
      day: tuesday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0

  # React 预览版——安全更新保留，普通升级关闭
  - package-ecosystem: npm
    directory: /Web-Admin-React
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0

  # 2026-11-12 freeze: every Taro update is paused by user decision — version updates stay off
  # through `open-pull-requests-limit: 0`, and a Taro security PR is reported, not merged.
  # 2026-11-12 冻结：Taro 的所有更新按用户决定暂停 —— 普通更新由 `open-pull-requests-limit: 0` 关闭；
  # Taro 的安全更新 PR 只报告、不合并。
  # Taro 小程序 / H5（npm / pnpm lockfile）
  - package-ecosystem: npm
    directory: /Front-Taro
    schedule:
      interval: weekly
      day: wednesday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0

  # Flutter 主 App（Dart pub）
  - package-ecosystem: pub
    directory: /Front-Flutter
    schedule:
      interval: weekly
      day: thursday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0

  # Docker 基础镜像——安全更新保留，普通升级人工处理
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0

  # GitHub Actions——补上 Actions 依赖安全监控
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "03:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
