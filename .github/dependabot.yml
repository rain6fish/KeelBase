# Dependabot 自动依赖更新（Security and quality：漏洞依赖自动升版）
# 依赖提醒（Dependabot alerts）由 GitHub 自动开启（公开仓库免费）；此处配置 version updates。
# 更新 PR 合并后由 CI（ci.yml）验证；高严重度依赖告警优先处理。
# 大版本（semver-major）统一不做自动升版（下方各 update 块 ignore 配置）；需升级主版本时人工操作/临时移除 ignore。
# dependabot-merge 低峰自动合入仅针对 CI 全绿的小版本（minor/patch）。

version: 2
updates:
  # 后端 NestJS（npm，依赖最多，安全重点）
  - package-ecosystem: npm
    directory: /Server-NestJS
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Web 管理台 / 工作台（Vue3，npm）
  - package-ecosystem: npm
    directory: /Web-Admin-Vue
    schedule:
      interval: weekly
      day: tuesday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 8
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # React 预览版（npm，保持跟进主版本）
  - package-ecosystem: npm
    directory: /Web-Admin-React
    schedule:
      interval: weekly
      day: tuesday
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Taro 小程序 / H5（pnpm——dependabot npm ecosystem 识别 pnpm-lock.yaml）
  - package-ecosystem: npm
    directory: /Front-Taro
    schedule:
      interval: weekly
      day: wednesday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 8
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Flutter 主 App（Dart pub）
  - package-ecosystem: pub
    directory: /Front-Flutter
    schedule:
      interval: weekly
      day: thursday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 8
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Docker 基础镜像（多阶段构建）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
