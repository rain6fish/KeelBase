# D.3 蓝绿/金丝雀部署 — Nginx upstream 配置（由 blue-green.sh 生成并重载）
# 替换默认 nginx.conf 的 `proxy_pass http://server:3000` 为本 upstream。
# 蓝绿：weight=100/0 全量切换；金丝雀：逐步调 weight（如 95/5 → 50/50 → 0/100）。
upstream keelbase_api {
    server server-blue:3000  weight=100 max_fails=3 fail_timeout=10s;
    server server-green:3000 weight=0   max_fails=3 fail_timeout=10s;
}
