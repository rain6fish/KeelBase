version: '3.8'

services:
  postgres:
    # pgvector 官方镜像（含 pgvector 扩展，用于 RAG 向量检索 AI-5）
    image: pgvector/pgvector:pg17
    # 从 .env.production 读 POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD（与 server 的 DB_* 同步）
    env_file:
      - ./Server-Nodejs/.env.production
    # 不暴露宿主机端口（仅容器内网被 server 访问）；调试需直连时用 `docker compose run -p 5432:5432 postgres`
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # 同 postgres：不暴露宿主机端口
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "3000:3000"
    # 密钥/密码从 .env.production 注入（deploy.sh / experience.sh 会生成随机密钥）。
    # 容器内 ENCRYPTION_KEY 等缺失时，NestJS 配置校验会失败——因此启动前必须先有该文件。
    env_file:
      - ./Server-Nodejs/.env.production
    environment:
      - PORT=3000
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
