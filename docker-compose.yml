version: '3.8'

services:
  postgres:
    # pgvector 官方镜像（含 pgvector 扩展，用于 RAG 向量检索 AI-5）
    image: pgvector/pgvector:pg17
    # 从 .env.production 读 POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD（与 server 的 DB_* 同步）
    env_file:
      - ./Server-NestJS/.env.production
    # 不暴露宿主机端口（仅容器内网被 server 访问）；调试需直连时用 `docker compose run -p 5432:5432 postgres`
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # loopback-only 暴露：仅本机 localhost:6379（本地宿主开发 server/e2e 需连 Redis）。
    # 容器内 server 仍走内部网络 redis://redis:6379；生产不绑 0.0.0.0，避免外网暴露。
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "3000:3000"
    # 持久化 /app/server/data（登录统计 login-stats.log、uploads 等）——容器重建（升级）不丢；reset 清库不碰文件
    volumes:
      - server-data:/app/server/data
    # 密钥/密码从 .env.production 注入（deploy.sh / experience.sh 会生成随机密钥）。
    # 容器内 ENCRYPTION_KEY 等缺失时，NestJS 配置校验会失败——因此启动前必须先有该文件。
    env_file:
      - ./Server-NestJS/.env.production
    environment:
      - PORT=3000
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379
      - CACHE_ENABLED=true
      # P1-3：本地模型编排（--profile private-ai 起 ollama 后生效；AI_PROVIDER=ollama 全走本地，数据不出域）
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy

  # ---- P1-3 私有化 AI：本地模型（可选编排，--profile private-ai 启用）----
  # 验证者 `docker compose --profile private-ai up -d ollama` 一键起本地模型；
  # 后端配 OLLAMA_BASE_URL=http://ollama:11434 + AI_PROVIDER=ollama 即全走本地（数据不出域）。
  # 注意：中国网络拉 Docker Hub ollama 镜像可能受限；也可用宿主机原生 Ollama
  #       （OLLAMA_BASE_URL=http://host.docker.internal:11434 指向宿主，见 verify-private-ai.sh）。
  ollama:
    image: ollama/ollama:latest
    profiles: ["private-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  pgdata:
  server-data:
  ollama-data:
