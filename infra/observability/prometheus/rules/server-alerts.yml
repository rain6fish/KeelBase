groups:
  - name: server-alerts
    rules:
      # 1. server 实例不可达
      - alert: ServerDown
        expr: up{job="server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Server 不可达"
          description: "job=server 已停止上报 {{ $labels.instance }} 超过 1 分钟"

      # 2. 高错误率（5xx 占比 > 10%）
      - alert: HighRequestErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (route)
            / sum(rate(http_requests_total[5m])) by (route) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "路由 {{ $labels.route }} 错误率过高"
          description: "5xx 占比超过 10% 持续 5 分钟"

      # 3. 高延迟（P95 > 1s）
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "请求延迟过高"
          description: "P95 延迟超过 1s 持续 5 分钟"

      # 4. 高并发（在途请求 > 100）
      - alert: HighInflightRequests
        expr: sum(http_requests_in_flight) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "在途请求过多"
          description: "并发在途请求超过 100 持续 5 分钟"
