global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'server'
    scrape_interval: 5s
    metrics_path: /api/v1/metrics
    static_configs:
      # 本地开发：server 跑在宿主机，用 host.docker.internal 访问
      # 生产 Docker 部署（server 也在 compose 网络）：改回 ['server:3000']
      - targets: ['host.docker.internal:3000']
