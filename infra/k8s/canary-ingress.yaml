# D.3 金丝雀发布：新版本(canary)先接 10% 流量，观察指标后逐步放量。
# 需 nginx-ingress 启用 canary 注解（--enable-annotation-validation 可校验）。
# 配合 `backend-canary-deployment.yaml`（部署 canary deployment，selector 加 version: canary）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keelbase-canary
  namespace: keelbase
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"   # 10% 流量给 canary；逐步 30/50/80 → 100 后摘除
    nginx.ingress.kubernetes.io/canary-by-header: "x-canary"   # 可选：header 强制走 canary（测试用户）
spec:
  ingressClassName: nginx
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keelbase-backend-canary
                port:
                  number: 80
---
# 金丝雀 Deployment（复制 backend-deployment，selector 加 version: canary + 独立 Service）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keelbase-backend-canary
  namespace: keelbase
  labels:
    app.kubernetes.io/name: keelbase
    app.kubernetes.io/component: backend
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keelbase
      app.kubernetes.io/component: backend
      version: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keelbase
        app.kubernetes.io/component: backend
        version: canary
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: rain6fish/keelbase:0.10.0-rc.1   # 新版本镜像
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          envFrom:
            - configMapRef: { name: keelbase-config }
            - secretRef: { name: keelbase-secret }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: keelbase-backend-canary
  namespace: keelbase
spec:
  selector:
    app.kubernetes.io/name: keelbase
    app.kubernetes.io/component: backend
    version: canary
  ports:
    - name: http
      port: 80
      targetPort: http
