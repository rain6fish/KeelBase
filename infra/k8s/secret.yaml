apiVersion: v1
kind: Secret
metadata:
  name: keelbase-secret
  namespace: keelbase
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME_32_CHARS_MIN"
  JWT_REFRESH_SECRET: "REPLACE_ME_32_CHARS_MIN"
  ENCRYPTION_KEY: "REPLACE_ME_64_HEX"
  ENCRYPTION_HMAC_KEY: "REPLACE_ME_64_HEX"
  DEEPSEEK_API_KEY: ""
