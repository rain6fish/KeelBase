# D.2 后端 Deployment（NestJS 单容器，含静态托管 Web-Admin + Flutter web）。
# 滚动更新 + 探针 + 资源限制；副本数与 HPA 联动。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keelbase-backend
  namespace: keelbase
  labels:
    app.kubernetes.io/name: keelbase
    app.kubernetes.io/component: backend
spec:
  # 滚动更新：maxUnavailable 0 保证滚动期间不降级可用副本；maxSurge 1 允许多起一个
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  # 单副本默认（Trust Runtime 承诺）：实时连接 / R3 确认 token / 审计链串行化均为进程内状态，
  # 多副本会导致实时事件跨实例失效、确认 token 失效、审计链分叉。横向扩展需先做
  # Redis pub/sub + 审计链 DB 级串行（roadmap §22.10「多副本决策」），当前默认单副本保一致性。
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keelbase
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keelbase
        app.kubernetes.io/component: backend
    spec:
      # 非 root 运行（镜像已 USER node）
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: rain6fish/keelbase:0.9.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # 探针：readiness 就绪才接流量；liveness 失效则重启
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          envFrom:
            - configMapRef:
                name: keelbase-config
            - secretRef:
                name: keelbase-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # 优雅停机：SIGTERM 后等待完成在途请求
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
