# D.2 后端 Service（ClusterIP，Ingress 暴露）。
apiVersion: v1
kind: Service
metadata:
  name: keelbase-backend
  namespace: keelbase
  labels:
    app.kubernetes.io/name: keelbase
spec:
  selector:
    app.kubernetes.io/name: keelbase
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
