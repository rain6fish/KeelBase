# D.2 入口 Ingress（nginx-ingress）。
# TLS 证书经 cert-manager 或预置 secret（keelbase-tls）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keelbase
  namespace: keelbase
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"   # SSE/AI 流式长连接
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: keelbase-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keelbase-backend
                port:
                  number: 80
