<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>KeelBase Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0f172a; overflow: hidden; }
    body { font-family: "Cascadia Code", "Consolas", monospace; color: #e2e8f0; }
    #term { width: 100%; height: 100%; padding: 28px 32px; font-size: 21px; line-height: 1.5; }
    .cmd { color: #93c5fd; font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; }
    .cmd::before { content: "$ "; color: #34d399; }
    .out { color: #cbd5e1; white-space: pre-wrap; }
    .ok { color: #34d399; }
    .warn { color: #fbbf24; }
    .dim { color: #64748b; }
    .cursor { display: inline-block; width: 12px; height: 24px; background: #34d399; animation: blink 1s step-end infinite; vertical-align: -4px; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="term"></div>
  <script>
    // 真实命令 + 真实输出（捕获自实际运行；省略处以 … 标注）
    const SCENES = {
      consulting: [
        ['cmd', 'node scripts/generator/business-spec.mjs --in .keelbase/business-spec/followup-plans.json --out specs/followup-plans.json'],
        ['ok', '✓ followup-plans → 模块协议「followup_plans」(5 字段)'],
        ['out', '  · 单一角色「sales」按本人所有权生成'],
        ['out', '  · decisions（2 项）保留在 Business Spec / Evidence，不进协议'],
        ['out', '  · acceptance（2 项）保留在 Business Spec / Evidence，不进协议'],
        ['out', '  · outOfScope（2 项）保留在 Business Spec / Evidence，不进协议'],
        ['warn', '⚠ 2 项不可映射（需手写补全）：'],
        ['warn', '  - 同一客户同一周内不重复建立跟进计划 → 服务层手写 + 单测覆盖'],
        ['warn', '  - 计划日期必须落在未来 7 天内 → 服务层手写 + 单测覆盖'],
        ['dim', '▲ 业务规格 → 模块协议：能确定的确定性映射，说不清的显式进手写清单'],
      ],
      build: [
        ['cmd', 'node scripts/keelbase-init.mjs --spec specs/invoices.json'],
        ['out', '生成业务模块：invoices（发票）'],
        ['out', '  singular=invoice plural=invoices 类=Invoices 字段=[invoiceNo, customerName, amount, status, dueDate]'],
        ['ok', '✓ 已生成 23 个文件（后端 + AI 工具 + Flutter + Web-Admin-Vue + Taro）'],
        ['ok', '✓ 接线：Server-NestJS/src/app.module.ts'],
        ['ok', '✓ 接线：Server-NestJS/src/common/modules/modules-manifest.ts'],
        ['ok', '✓ 接线：Server-NestJS/src/authz/generated-role-rules.ts'],
        ['ok', '✓ 接线：Server-NestJS/src/ai/ai.module.ts'],
        ['ok', '✓ 接线：Web-Admin-Vue/src/router/routes.ts'],
        ['ok', '✓ 接线：Front-Flutter/lib/core/router/app_router.dart'],
        ['out', '生成物：query-invoices.tool.ts（读）· create-invoices.tool.ts（写，需人工确认）'],
        ['ok', '✓ .keelbase/manifest.json（keelbase v1.0.10 / protocol 1.0）'],
        ['dim', '下一步：cd Server-NestJS && npm run build && npm test -- invoices.service'],
      ],
      bridge: [
        ['cmd', 'node scripts/keelbase-init.mjs --import-openapi-proxy specs/external-crm.openapi.json --base-url http://localhost:8082 --audience legacy-crm'],
        ['out', '{'],
        ['out', '  "baseUrl": "http://localhost:8082",'],
        ['out', '  "audience": "legacy-crm",'],
        ['out', '  "tools": ['],
        ['ok', '    GET  /customers          → list_customers      | R1 自动（读）'],
        ['ok', '    GET  /customers/{id}     → get_customer        | R1 自动（读）'],
        ['ok', '    GET  /customers/{id}/orders → list_customer_orders | R1 自动（读）'],
        ['warn', '    POST /customers/{id}/followups → create_followup_task | R3 需人工确认（写）'],
        ['warn', '    PATCH /customers/{id}/orders/{orderId} → update_order_amount | R3 需人工确认（写）'],
        ['out', '  ]'],
        ['out', '}'],
        ['dim', '▲ B 路径 Proxy 工具：外部 OpenAPI → 治理工具（读 R1 自动 / 写 R3 确认）'],
        ['out', '业务闭环：读外部客户/订单（R1）→ 分析风险 → 建跟进任务（R3 确认）'],
        ['out', '  → 写回外部 CRM（proxy_call 副作用）→ 审计哈希链 → 可撤销（Java 补偿）'],
      ],
      private: [
        ['cmd', './scripts/verify-private-ai.sh'],
        ['out', '═══ KeelBase 私有 AI 验证（数据不出域）═══'],
        ['ok', '✓ Cloud Provider OFF（无外部 LLM Key）'],
        ['ok', '✓ Ollama 本地模型（AI_PROVIDER=ollama，qwen2.5:7b）'],
        ['ok', '✓ 本地 Embedding（bge-m3）'],
        ['ok', '✓ 本地 RAG 知识库'],
        ['ok', '✓ Agent 工具调用（数据不出域）'],
        ['ok', '✓ 审计记录（provider=ollama）'],
        ['dim', '配置：OLLAMA_BASE_URL=http://localhost:11434  AI_CHAT_MODEL=qwen2.5:7b'],
        ['dim', '部署：Docker · Offline · On-Premise · Private Data'],
      ],
      evidence: [
        ['cmd', 'node scripts/render-period-report.mjs export.json --lang zh --out period-report.html'],
        ['out', '═══ 期间审计报告（D-1，离线自包含）═══'],
        ['ok', '结论：PASS（模式：结构验证）'],
        ['out', '报告：period-report.html'],
        ['dim', '▲ 单文件 HTML，零外链零依赖——审计方离线复核，不必安装 KeelBase'],
      ],
    };

    // English scenes (en = default)
    const SCENES_EN = {
      consulting: [
        ['cmd', 'node scripts/generator/business-spec.mjs --in .keelbase/business-spec/followup-plans.json --out specs/followup-plans.json'],
        ['ok', '✓ followup-plans → module protocol "followup_plans" (5 fields)'],
        ['out', '  · single role "sales", ownership-scoped'],
        ['out', '  · decisions (2) kept in Business Spec / Evidence, not the protocol'],
        ['out', '  · acceptance (2) kept in Business Spec / Evidence, not the protocol'],
        ['out', '  · outOfScope (2) kept in Business Spec / Evidence, not the protocol'],
        ['warn', '⚠ 2 items cannot be mapped (need hand-written code):'],
        ['warn', '  - no duplicate follow-up plan per customer per week → service layer + unit test'],
        ['warn', '  - planned date must fall within the next 7 days → service layer + unit test'],
        ['dim', '▲ business spec → module protocol: deterministic where it can be, explicit when it cannot'],
      ],
      build: [
        ['cmd', 'node scripts/keelbase-init.mjs --spec specs/invoices.json'],
        ['out', 'Generating business module: invoices'],
        ['out', '  singular=invoice plural=invoices class=Invoices fields=[invoiceNo, customerName, amount, status, dueDate]'],
        ['ok', '✓ generated 23 files (backend + AI tools + Flutter + Web-Admin-Vue + Taro)'],
        ['ok', '✓ wired: Server-NestJS/src/app.module.ts'],
        ['ok', '✓ wired: Server-NestJS/src/common/modules/modules-manifest.ts'],
        ['ok', '✓ wired: Server-NestJS/src/authz/generated-role-rules.ts'],
        ['ok', '✓ wired: Server-NestJS/src/ai/ai.module.ts'],
        ['ok', '✓ wired: Web-Admin-Vue/src/router/routes.ts'],
        ['ok', '✓ wired: Front-Flutter/lib/core/router/app_router.dart'],
        ['out', 'Generated: query-invoices.tool.ts (read) · create-invoices.tool.ts (write, needs approval)'],
        ['ok', '✓ .keelbase/manifest.json (keelbase v1.0.10 / protocol 1.0)'],
        ['dim', 'Next: cd Server-NestJS && npm run build && npm test -- invoices.service'],
      ],
      bridge: [
        ['cmd', 'node scripts/keelbase-init.mjs --import-openapi-proxy specs/external-crm.openapi.json --base-url http://localhost:8082 --audience legacy-crm'],
        ['out', '{'],
        ['out', '  "baseUrl": "http://localhost:8082",'],
        ['out', '  "audience": "legacy-crm",'],
        ['out', '  "tools": ['],
        ['ok', '    GET  /customers          → list_customers       | R1 auto (read)'],
        ['ok', '    GET  /customers/{id}     → get_customer         | R1 auto (read)'],
        ['ok', '    GET  /customers/{id}/orders → list_customer_orders | R1 auto (read)'],
        ['warn', '    POST /customers/{id}/followups → create_followup_task | R3 needs approval (write)'],
        ['warn', '    PATCH /customers/{id}/orders/{orderId} → update_order_amount | R3 needs approval (write)'],
        ['out', '  ]'],
        ['out', '}'],
        ['dim', '▲ B-path proxy tools: external OpenAPI → governed tools (read auto / write approved)'],
        ['out', 'Loop: read external CRM → assess risk → create follow-up (R3 approval)'],
        ['out', '  → write back (proxy side effect) → audit chain → revoke (Java compensation)'],
      ],
      private: [
        ['cmd', './scripts/verify-private-ai.sh'],
        ['out', '═══ KeelBase private AI verification (data stays in-domain) ═══'],
        ['ok', '✓ Cloud Provider OFF (no external LLM key)'],
        ['ok', '✓ Ollama local model (AI_PROVIDER=ollama, qwen2.5:7b)'],
        ['ok', '✓ Local embeddings (bge-m3) + local RAG'],
        ['ok', '✓ Agent tool calls (data never leaves domain)'],
        ['ok', '✓ Audit recorded (provider=ollama)'],
        ['dim', 'Config: OLLAMA_BASE_URL=http://localhost:11434  AI_CHAT_MODEL=qwen2.5:7b'],
        ['dim', 'Deploy: Docker · Offline · On-Premise · Private Data'],
      ],
      evidence: [
        ['cmd', 'node scripts/render-period-report.mjs export.json --lang en --out period-report.html'],
        ['out', '═══ Period audit report (D-1, offline, self-contained) ═══'],
        ['ok', 'Verdict: PASS (mode: structural verification)'],
        ['out', 'Report: period-report.html'],
        ['dim', '▲ one self-contained HTML file, zero external links — auditors verify it offline, no KeelBase install'],
      ],
    };

    const type = new URLSearchParams(location.search).get('type') || 'build';
    const lang = new URLSearchParams(location.search).get('lang') || 'en';
    const SC = lang === 'zh' ? SCENES : SCENES_EN;
    const lines = SC[type] || SC.build;
    const term = document.getElementById('term');

    async function render() {
      const doc = document.createDocumentFragment();
      for (const [cls, text] of lines) {
        const div = document.createElement('div');
        div.className = cls;
        div.textContent = text;
        doc.appendChild(div);
      }
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      term.appendChild(doc);
      // 逐行出现（打字感）：先全部渲染，用 opacity 逐行淡入 + 光标在底部
      const children = [...term.querySelectorAll('.cmd, .out, .ok, .warn, .dim')];
      children.forEach((el, i) => {
        el.style.opacity = '0';
        el.style.transition = `opacity 0.2s ease ${i * 0.35}s`;
        setTimeout(() => { el.style.opacity = '1'; }, 50);
      });
      setTimeout(() => term.appendChild(cursor), children.length * 350 + 300);
    }
    render();
  </script>
</body>
</html>
