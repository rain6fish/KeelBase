<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>KeelBase Terminal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0f172a; overflow: hidden; }
    body { font-family: "Cascadia Code", "Consolas", monospace; color: #e2e8f0; }
    #term { width: 100%; height: 100%; padding: 28px 32px; font-size: 21px; line-height: 1.5; }
    .cmd { color: #93c5fd; font-weight: 700; }
    .cmd::before { content: "$ "; color: #34d399; }
    .out { color: #cbd5e1; white-space: pre-wrap; }
    .ok { color: #34d399; }
    .warn { color: #fbbf24; }
    .dim { color: #64748b; }
    .cursor { display: inline-block; width: 12px; height: 24px; background: #34d399; animation: blink 1s step-end infinite; vertical-align: -4px; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="term"></div>
  <script>
    // 真实命令 + 真实输出（捕获自实际运行）
    const SCENES = {
      build: [
        ['cmd', 'keelbase init --spec specs/invoices.json'],
        ['out', '生成业务模块：invoices（发票）'],
        ['out', '  singular=invoice plural=invoices 类=Invoices 字段=[invoiceNo, amount, status]'],
        ['ok', '✓ 接线：Server-NestJS/src/app.module.ts'],
        ['ok', '✓ 接线：Server-NestJS/src/ai/ai.module.ts  （query_invoices 读 + create_invoices 写需确认）'],
        ['ok', '✓ 接线：Server-NestJS/src/common/modules/modules-manifest.ts'],
        ['ok', '✓ 接线：Server-NestJS/src/common/casl/casl-ability.factory.ts'],
        ['ok', '✓ 接线：Front-Flutter / Web 工作台 / Taro + 路由 + i18n'],
        ['out', '生成物：'],
        ['out', '  Server-NestJS/src/invoices/invoice.entity.ts + dto + service + controller + module'],
        ['out', '  Server-NestJS/src/ai/tools/query-invoices.tool.ts（读）'],
        ['out', '  Server-NestJS/src/ai/tools/create-invoices.tool.ts（写，需人工确认）'],
        ['out', '  Front-Flutter/lib/features/invoices/... + Web 工作台页面'],
        ['dim', '下一步：npm run build && npm test -- invoices  →  20 passed'],
      ],
      bridge: [
        ['cmd', 'node scripts/keelbase-init.mjs --import-openapi-proxy specs/external-crm.openapi.json --base-url http://localhost:8082 --audience legacy-crm'],
        ['out', '{'],
        ['out', '  "baseUrl": "http://localhost:8082",'],
        ['out', '  "audience": "legacy-crm",'],
        ['out', '  "tools": ['],
        ['ok', '    GET  /customers          → list_customers      | R1 自动（读）'],
        ['ok', '    GET  /customers/{id}     → get_customer        | R1 自动（读）'],
        ['ok', '    GET  /customers/{id}/orders → list_customer_orders | R1 自动（读）'],
        ['warn', '    POST /customers/{id}/followups → create_followup_task | R3 需人工确认（写）'],
        ['warn', '    PATCH /customers/{id}/orders/{orderId} → update_order_amount | R3 需人工确认（写）'],
        ['out', '  ]'],
        ['out', '}'],
        ['dim', '▲ B 路径 Proxy 工具：外部 OpenAPI → 治理工具（读 R1 自动 / 写 R3 确认）'],
        ['out', '业务闭环：读外部客户/订单（R1）→ 分析风险 → 建跟进任务（R3 确认）'],
        ['out', '  → 写回外部 CRM（proxy_call 副作用）→ 审计哈希链 → 可撤销（Java 补偿）'],
      ],
      private: [
        ['cmd', './scripts/verify-private-ai.sh'],
        ['out', '═══ KeelBase 私有 AI 验证（数据不出域）═══'],
        ['ok', '✓ Cloud Provider OFF（无外部 LLM Key）'],
        ['ok', '✓ Ollama 本地模型（AI_PROVIDER=ollama，qwen2.5:7b）'],
        ['ok', '✓ 本地 Embedding（bge-m3）'],
        ['ok', '✓ 本地 RAG 知识库'],
        ['ok', '✓ Agent 工具调用（数据不出域）'],
        ['ok', '✓ 审计记录（provider=ollama）'],
        ['dim', '配置：OLLAMA_BASE_URL=http://localhost:11434  AI_CHAT_MODEL=qwen2.5:7b'],
        ['dim', '部署：Docker · Offline · On-Premise · Private Data'],
      ],
    };

    // English scenes (en = default)
    const SCENES_EN = {
      build: [
        ['cmd', 'keelbase init --spec specs/invoices.json'],
        ['out', 'Generating business module: invoices'],
        ['out', '  singular=invoice plural=invoices class=Invoices fields=[invoiceNo, amount, status]'],
        ['ok', '✓ wired: Server-NestJS/src/app.module.ts'],
        ['ok', '✓ wired: Server-NestJS/src/ai/ai.module.ts (query_invoices read + create_invoices write needs approval)'],
        ['ok', '✓ wired: Server-NestJS/src/common/modules/modules-manifest.ts'],
        ['ok', '✓ wired: Flutter / Web workbench / Taro + routes + i18n'],
        ['out', 'Generated:'],
        ['out', '  invoice.entity.ts + dto + service + controller + module'],
        ['out', '  ai/tools/query-invoices.tool.ts (read)'],
        ['out', '  ai/tools/create-invoices.tool.ts (write, needs human approval)'],
        ['dim', 'Next: npm run build && npm test -- invoices → 20 passed'],
      ],
      bridge: [
        ['cmd', 'node scripts/keelbase-init.mjs --import-openapi-proxy specs/external-crm.openapi.json --base-url http://localhost:8082 --audience legacy-crm'],
        ['out', '{'],
        ['out', '  "baseUrl": "http://localhost:8082",'],
        ['out', '  "audience": "legacy-crm",'],
        ['out', '  "tools": ['],
        ['ok', '    GET  /customers          → list_customers       | R1 auto (read)'],
        ['ok', '    GET  /customers/{id}     → get_customer         | R1 auto (read)'],
        ['ok', '    GET  /customers/{id}/orders → list_customer_orders | R1 auto (read)'],
        ['warn', '    POST /customers/{id}/followups → create_followup_task | R3 needs approval (write)'],
        ['warn', '    PATCH /customers/{id}/orders/{orderId} → update_order_amount | R3 needs approval (write)'],
        ['out', '  ]'],
        ['out', '}'],
        ['dim', '▲ B-path proxy tools: external OpenAPI → governed tools (read auto / write approved)'],
        ['out', 'Loop: read external CRM → assess risk → create follow-up (R3 approval)'],
        ['out', '  → write back (proxy side effect) → audit chain → revoke (Java compensation)'],
      ],
      private: [
        ['cmd', './scripts/verify-private-ai.sh'],
        ['out', '═══ KeelBase private AI verification (data stays in-domain) ═══'],
        ['ok', '✓ Cloud Provider OFF (no external LLM key)'],
        ['ok', '✓ Ollama local model (AI_PROVIDER=ollama)'],
        ['ok', '✓ Local embeddings (bge-m3) + local RAG'],
        ['ok', '✓ Agent tool calls (data never leaves domain)'],
        ['ok', '✓ Audit recorded (provider=ollama)'],
        ['dim', 'Config: OLLAMA_BASE_URL=http://localhost:11434  AI_CHAT_MODEL=qwen2.5:7b'],
        ['dim', 'Deploy: Docker · Offline · On-Premise · Private Data'],
      ],
    };

    const type = new URLSearchParams(location.search).get('type') || 'build';
    const lang = new URLSearchParams(location.search).get('lang') || 'en';
    const SC = lang === 'zh' ? SCENES : SCENES_EN;
    const lines = SC[type] || SC.build;
    const term = document.getElementById('term');

    async function render() {
      const doc = document.createDocumentFragment();
      for (const [cls, text] of lines) {
        const div = document.createElement('div');
        div.className = cls;
        div.textContent = text;
        doc.appendChild(div);
      }
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      term.appendChild(doc);
      // 逐行出现（打字感）：先全部渲染，用 opacity 逐行淡入 + 光标在底部
      const children = [...term.querySelectorAll('.cmd, .out, .ok, .warn, .dim')];
      children.forEach((el, i) => {
        el.style.opacity = '0';
        el.style.transition = `opacity 0.2s ease ${i * 0.35}s`;
        setTimeout(() => { el.style.opacity = '1'; }, 50);
      });
      setTimeout(() => term.appendChild(cursor), children.length * 350 + 300);
    }
    render();
  </script>
</body>
</html>
