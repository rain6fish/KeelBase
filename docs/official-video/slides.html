<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>KeelBase Demo Slides</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(160deg, #ffffff 0%, #f1f5f9 45%, #e2e8f0 100%);
      color: #1e293b;
      display: flex; align-items: center; justify-content: center;
    }
    #slide { max-width: 1080px; width: 92%; text-align: center; padding: 40px; }
    .kicker {
      font-size: 16px; letter-spacing: 6px; color: #2563eb; text-transform: uppercase;
      margin-bottom: 26px; font-weight: 700;
    }
    h1 { font-size: 46px; line-height: 1.3; font-weight: 700; color: #0f172a; margin-bottom: 18px; }
    .sub { font-size: 24px; line-height: 1.55; color: #334155; white-space: pre-line; }
    .big { font-size: 60px; line-height: 1.25; font-weight: 800; color: #0f172a; }
    .accent { color: #d97706; }
    .ok { color: #059669; font-weight: 600; }
    .err { color: #dc2626; font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-top: 22px; }
    .chip {
      background: #ffffff; border: 1px solid #cbd5e1;
      padding: 10px 22px; border-radius: 999px; font-size: 20px; color: #1e293b;
    }
    .line { margin: 8px 0; }
    .brand { font-size: 40px; font-weight: 800; color: #0f172a; }
    .brand-sub { font-size: 22px; color: #475569; margin-top: 8px; }
    .footer { margin-top: 40px; font-size: 18px; color: #64748b; }
    .arrow { color: #2563eb; font-weight: 700; }
    .fade { animation: fadeIn 1s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div id="slide"></div>
  <script>
    // 分镜语言：?lang=zh → slides-zh.js（中文），否则 slides.js（英文）
    (function () {
      const lang = new URLSearchParams(location.search).get('lang') || 'en';
      const s = document.createElement('script');
      s.src = lang === 'zh' ? 'slides-zh.js' : 'slides.js';
      document.head.appendChild(s);
    })();
  </script>
</body>
</html>
