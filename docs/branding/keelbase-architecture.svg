<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gradKeel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1d4ed8" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- 画布 -->
  <rect x="12" y="12" width="876" height="596" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 上区：AI 世界 -->
  <text x="450" y="52" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#64748b">AI APPLICATIONS / AGENTS</text>
  <text x="450" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">Agent Frameworks · Custom Agents · MCP Clients</text>

  <rect x="205" y="92" width="95" height="34" rx="999" fill="#ffffff" stroke="#dbe2ef" stroke-width="1.5"/>
  <text x="252" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">LangGraph</text>
  <rect x="312" y="92" width="90" height="34" rx="999" fill="#ffffff" stroke="#dbe2ef" stroke-width="1.5"/>
  <text x="357" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">AutoGen</text>
  <rect x="414" y="92" width="80" height="34" rx="999" fill="#ffffff" stroke="#dbe2ef" stroke-width="1.5"/>
  <text x="454" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">CrewAI</text>
  <rect x="506" y="92" width="120" height="34" rx="999" fill="#ffffff" stroke="#dbe2ef" stroke-width="1.5"/>
  <text x="566" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Custom Agents</text>
  <rect x="638" y="92" width="105" height="34" rx="999" fill="#ffffff" stroke="#dbe2ef" stroke-width="1.5"/>
  <text x="690" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">MCP Clients</text>

  <!-- 上箭头：northbound -->
  <line x1="450" y1="172" x2="450" y2="138" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="474" y="161" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">northbound — MCP · OpenAPI · Function Calling</text>

  <!-- 中间：KeelBase Trust Runtime -->
  <rect x="130" y="170" width="640" height="230" rx="18" fill="url(#gradKeel)" filter="url(#shadow)"/>
  <text x="160" y="200" font-size="10" font-weight="700" letter-spacing="2.5" fill="#93c5fd">THE TRUST LAYER</text>
  <text x="450" y="252" text-anchor="middle" font-size="34" font-weight="800" fill="#ffffff">KeelBase</text>
  <text x="450" y="286" text-anchor="middle" font-size="17" font-weight="600" fill="#bfdbfe">Enterprise AI Trust Runtime</text>
  <line x1="352" y1="306" x2="548" y2="306" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"/>
  <text x="450" y="344" text-anchor="middle" font-size="14" font-weight="500" fill="#dbeafe">identity · policy · governance · audit · runtime · deployment</text>

  <!-- 下箭头：southbound -->
  <line x1="450" y1="400" x2="450" y2="438" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="474" y="428" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">southbound — Bridge · Protocol · Capability Mapping</text>

  <!-- 下区：企业世界 -->
  <text x="450" y="492" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#64748b">EXISTING BUSINESS SYSTEMS</text>
  <text x="450" y="514" text-anchor="middle" font-size="13" font-weight="500" fill="#94a3b8">no rip-and-replace</text>

  <rect x="268" y="524" width="80" height="34" rx="999" fill="#ffffff" stroke="#dbe2ef" stroke-width="1.5"/>
  <text x="308" y="546" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">CRM</text>
  <rect x="362" y="524" width="80" height="34" rx="999" fill="#ffffff" stroke="#dbe2ef" stroke-width="1.5"/>
  <text x="402" y="546" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">ERP</text>
  <rect x="456" y="524" width="70" height="34" rx="999" fill="#ffffff" stroke="#dbe2ef" stroke-width="1.5"/>
  <text x="491" y="546" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">OA</text>
  <rect x="540" y="524" width="80" height="34" rx="999" fill="#ffffff" stroke="#dbe2ef" stroke-width="1.5"/>
  <text x="580" y="546" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">MES</text>
  <rect x="634" y="524" width="105" height="34" rx="999" fill="#ffffff" stroke="#dbe2ef" stroke-width="1.5"/>
  <text x="686" y="546" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">Database</text>

  <!-- tagline -->
  <text x="450" y="588" text-anchor="middle" font-size="14" font-weight="600" font-style="italic" fill="#1d4ed8">Make any agent enterprise-safe — without replacing your stack</text>
</svg>
